<html>
  <body>
    <div>
      <br />
      <br />
      <br />
      <br />
      <br />
      <br />
      <h1 class="stroked-text"> Hey Pookie! <br> Will you be my valentine? </h1>
      <img
        id="valentineImage"
        src="IMG_0814.jpg"
        alt="Valentine's Day Image"
        style="max-width: 350px; height: auto"
      />
      <br />
      <br />
      <br />
      <button id="yesButton">Yes</button>
      <button id="no">No</button>
    </div>

    <style>
      body {
        background: linear-gradient(to bottom, #f5cac3, #f7ede2);
      }
      div {
        text-align: center;
        vertical-align: middle;
      }
        .stroked-text {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
            color: white;
            -webkit-text-stroke: 1px black;
      }
      #yesButton {
        background-color: #06d6a0;
        transition: transform 0.3s;
        margin-right: 10px;
        width: 120px;
        font-size: 15px;
        height: 40px;
        color: #fff;
        margin-left: -140px;
      }
      #no {
        position: absolute;
        background-color: #ef476f;
        transition: transform 0.3s;
        margin-left: 10px;
        width: 120px;
        font-size: 15px;
        height: 40px;
        color: #fff;
      }
    </style>
    <script>
      document.getElementById("yesButton").addEventListener("click", goToPage);

      function goToPage() {
        window.location.href = "your_other_page.html";
      }

      var yesButton = document.getElementById("yesButton");
      var no = document.getElementById("no");
      var valentineImage = document.getElementById("valentineImage");

      var noTexts = [
        "Huh?",
        "Wrong answer!",
        "Shawty please",
        "Bruh Katrina",
        "-100 Aura points",
        "I know where you live",
      ];
      var imageSources = [
        "funny.jpg",
        "doing.jpg",
        "please.jpg",
        "really.jpg",
      ];

      no.addEventListener("click", change);

      function change() {
        var randomIndex = Math.floor(Math.random() * noTexts.length);
        var randomText = noTexts[randomIndex];
        no.innerText = randomText;

        var i = Math.floor(Math.random() * 1000) + 1;
        var j = Math.floor(Math.random() * 700) + 1;
        no.style.left = i + "px";
        no.style.top = j + "px";

        var currentWidth = yesButton.offsetWidth;
        var currentHeight = yesButton.offsetHeight;
        yesButton.style.width = currentWidth + 30 + "px";
        yesButton.style.height = currentHeight + 10 + "px";

        var randomImageIndex = Math.floor(Math.random() * imageSources.length);
        valentineImage.src = imageSources[randomImageIndex];
      }
    </script>
  </body>
</html>
